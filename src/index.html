<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veille informatique by Myriam</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:16px/1.5 system-ui,sans-serif}header,main{max-width:1380px;margin:auto;padding:0 5vw}header{height:74px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}header b{font-size:25px;letter-spacing:-1.6px}header span,small,label{color:var(--muted)}header i{margin-left:auto;font-style:normal;font:13px monospace} .mark{display:grid;place-items:center;width:34px;height:34px;background:var(--accent-gradient);color:#1b1024;border-radius:9px;font-size:26px}main{padding-bottom:60px}.hero{position:relative;overflow:hidden;padding:38px 0 30px;border-bottom:1px solid var(--line)}.hero>div{position:relative;z-index:1}.eyebrow,.tag{font:12px monospace;letter-spacing:.1em;color:var(--violet)}.hero h1{font-size:clamp(34px,5vw,68px);line-height:1.04;letter-spacing:-.07em;margin:12px 0}.hero p{color:var(--muted);margin:0}canvas{position:absolute;right:0;top:0;width:36%;height:100%;opacity:.85}nav{display:flex;gap:24px;overflow:auto;border-bottom:1px solid var(--line)}button,select,input{font:inherit;color:inherit;background:var(--control);border:1px solid var(--outline);border-radius:7px;padding:8px 12px}button{cursor:pointer}nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:16px 0;white-space:nowrap}nav button.active{border-color:var(--violet);color:var(--violet)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:23px;letter-spacing:-.04em;margin:25px 0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,article,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.card{text-align:left}.card strong{display:block;font:42px/1.3 monospace;letter-spacing:-.08em}.card small{display:block}.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:24px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input{min-width:100px;flex:1}article{margin-bottom:10px}article h3{margin:7px 0;font-size:19px}article p,.panel p{color:var(--muted);margin:5px 0}.tag{letter-spacing:.05em}a{color:var(--lavender);text-underline-offset:3px}.panel{margin-bottom:10px}.horizon{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:9px;padding:15px}.horizon b{padding:9px;border-radius:7px;background:#392747;color:var(--violet);font:20px monospace}.horizon small{display:block}details{margin-top:8px}summary{cursor:pointer}select{max-width:100%}:focus-visible{outline:2px solid var(--violet)}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.cols{display:block}canvas{opacity:.22;width:55%}header span{display:none}nav{gap:16px}.row{flex-wrap:wrap}main{padding-inline:16px}.hero p{max-width:90%}}
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.highlights article{border-top:3px solid var(--lavender)}.highlights h3 a{color:inherit;text-decoration:none}.highlights h3 a:hover{text-decoration:underline}
nav{gap:.5rem;padding:.7rem 0}
nav button{padding:.55rem .95rem;border:1px solid var(--outline);border-radius:.65rem}
nav button.active{background:linear-gradient(110deg,#4b2868,#301d41);color:var(--text)}
nav button:not(.active):hover{background:var(--control);border-color:var(--lavender)}
.kpi-panel{margin-top:2rem;padding:clamp(1rem,2vw,1.6rem);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:1rem}
.kpi-panel h2{margin:0 0 1rem}
.kpi-scroll{overflow-x:auto}
.kpi-panel table{width:100%;border-collapse:collapse;text-align:left;font-size:.94rem}
.kpi-panel th,.kpi-panel td{padding:.85rem .75rem;border-bottom:1px solid var(--line);vertical-align:top}
.kpi-panel thead{background:#2c2036;color:var(--lavender)}
.kpi-panel tbody th{width:18%}
.kpi-panel td:last-child,.kpi-panel td:nth-child(3){white-space:nowrap}
@media(max-width:850px){.kpi-panel table{min-width:54rem}}
.source-tracking>h2{margin-top:2rem}.source-manual{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}.source-manual article{margin:0}.source-manual h3{font-size:1rem}.source-tracking .source-associations label{display:grid;min-width:0;flex:1 0 min(100%,260px)}.source-tracking .source-associations button{align-self:end}.source-tracking .source-associations [role=status]{align-self:center}
</style><header><b class="mark" aria-hidden="true">≋</b><div class="brand"><b>Veille informatique</b><span>by Myriam</span></div><i>ESPACE DE VEILLE</i></header><main><section class="hero"><canvas id="radar" width="600" height="250" aria-hidden="true"></canvas><div><span class="eyebrow">OBSERVATOIRE CYBER & IT</span><h1>Tableau de veille</h1><p>Les publications, incidents et échéances de ta veille informatique.</p></div></section><nav id="nav" aria-label="Rubriques de Veille informatique by Myriam"></nav><div id="view"></div><template id="pertinence-template">
<section class="kpi-panel" aria-labelledby="titre-pertinence">
  <div class="row"><h2 id="titre-pertinence">Pertinence</h2><label>Mois du bilan <input type="month" id="review-month" required></label></div>
  <div class="kpi-scroll" role="region" aria-label="Indicateurs de pertinence" tabindex="0">
    <table aria-labelledby="titre-pertinence">
      <thead><tr><th scope="col">KPI</th><th scope="col">Calcul / mesure</th><th scope="col">Cible</th><th scope="col">Statut</th><th scope="col">Action corrective SLA</th><th scope="col">Délai</th></tr></thead>
      <tbody>
        <tr data-review-kpi="relevance" data-target="80"><th scope="row">Taux de pertinence</th>
          <td><strong data-result></strong><br><small data-detail></small></td><td>80 %</td><td data-status></td>
          <td><span data-correction hidden>Réviser les mots-clés et les filtres</span></td><td><span data-correction hidden>7 jours</span></td></tr>
        <tr data-review-kpi="coverage" data-target="100"><th scope="row">Couverture thématique</th>
          <td><strong data-result></strong><br><small data-detail></small></td><td>100 %</td><td data-status></td>
          <td><span data-correction hidden>Ajouter une source pour les thèmes absents</span></td><td><span data-correction hidden>7 jours</span></td></tr>
        <tr data-review-kpi="goals" data-target="80"><th scope="row">Conformité aux objectifs</th>
          <td><strong data-result></strong><br><small data-detail></small></td><td>80 %</td><td data-status></td>
          <td><span data-correction hidden>Analyser les écarts et ajuster la collecte</span></td><td><span data-correction hidden>7 jours</span></td></tr>
      </tbody>
    </table>
  </div>
  <h2>Objectifs du mois</h2>
  <form id="review-goal-form" class="filters">
    <label>Nouvel objectif <input id="review-goal" required></label>
    <button type="submit">Ajouter</button>
  </form>
  <div id="review-goals"></div>
  <h2>Publications du mois</h2>
  <div id="review-publications"></div>
</section>
</template></main><script src="/app.js"></script></html>
